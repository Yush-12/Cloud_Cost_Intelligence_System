services:
  app:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: cost-intel-app
    ports:
      - "5000:5000"
    environment:
      - AWS_REGION=us-east-1
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - PIPELINE_INTERVAL_SECONDS=900
      - CONFIDENCE_THRESHOLD=0.85
      - MAX_ACTIONS_PER_HOUR=5
    restart: unless-stopped

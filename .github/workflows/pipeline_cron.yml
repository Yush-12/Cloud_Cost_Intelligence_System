name: Scheduled Cost Telemetry Pipeline

on:
  schedule:
    # Run every 15 minutes (100% free with GitHub Actions)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline Cycle
        env:
          SIMULATION_MODE: "true"
          AWS_REGION: "us-east-1"
          # To run against real AWS instead of simulation mode, set SIMULATION_MODE: "false"
          # and add AWS_ACCESS_KEY_ID & AWS_SECRET_ACCESS_KEY in GitHub Repo Settings -> Secrets
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python src/pipeline.py --once


